version: '3.8'

x-defaults: &defaults
  namespace: ${NAMESPACE:-erkuysal/personal-site}
  version: ${VERSION:-latest}

services:
  # Standalone Redis for UserEngine testing (optional, usually shared)
  redis:
    image: redis:7-alpine
    container_name: userengine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - personalsite_network

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    image: ${NAMESPACE:-erkuysal/personal-site}:userengine-gateway-${VERSION:-latest}
    container_name: userengine-gateway
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - GATEWAY_ADDR=:8080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://erkuysal.com,https://www.erkuysal.com}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - personalsite_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api
    image: ${NAMESPACE:-erkuysal/personal-site}:userengine-api-${VERSION:-latest}
    container_name: userengine-api
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-production}
      - API_ADDR=:8081
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - personalsite_network

  sweeper:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker-sweeper
    image: ${NAMESPACE:-erkuysal/personal-site}:userengine-sweeper-${VERSION:-latest}
    container_name: userengine-sweeper
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - SWEEP_INTERVAL=30s
      - SWEEP_BATCH_SIZE=100
      - SWEEP_TIME_BUDGET=500ms
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - personalsite_network

  debouncer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker-debouncer
    image: ${NAMESPACE:-erkuysal/personal-site}:userengine-debouncer-${VERSION:-latest}
    container_name: userengine-debouncer
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - DEBOUNCE_DELAY=5s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - personalsite_network

  webhook:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: worker-webhook
    image: ${NAMESPACE:-erkuysal/personal-site}:userengine-webhook-${VERSION:-latest}
    container_name: userengine-webhook
    env_file:
      - .env
    environment:
      - REDIS_ADDR=redis:6379
      - WEBHOOK_ENABLED=true
      - WEBHOOK_STREAM_NAME=presence:webhooks
      - WEBHOOK_CONSUMER_GROUP=webhook-workers
      - WEBHOOK_RETRY_ATTEMPTS=3
      - WEBHOOK_TIMEOUT=10s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - personalsite_network

volumes:
  redis_data:

networks:
  personalsite_network:
    external: true

